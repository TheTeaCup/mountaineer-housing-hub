# Standalone deployment for a host running its own reverse proxy.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a GHCR release reference}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
